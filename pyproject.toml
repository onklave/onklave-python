[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "onklave"
version = "0.1.0"
description = "Onklave error tracking and end-user feedback SDK for Python"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Onklave (Pty) Ltd." }]
keywords = ["onklave", "error-tracking", "feedback", "observability"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Bug Tracking",
]
dependencies = []

[project.urls]
Homepage = "https://onklave.com"
Repository = "https://github.com/onklave/onklave-python"

[tool.hatch.build.targets.wheel]
packages = ["src/onklave"]
